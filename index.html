<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Block Puzzle</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <audio id="sfx-click" src="assets/button-click.mp3"></audio>
    <audio id="sfx-combo" src="assets/combo.mp3"></audio>
    <audio id="sfx-drop" src="assets/drop.mp3"></audio>
    <audio id="sfx-error" src="assets/error.mp3"></audio>
    <audio id="sfx-gameover" src="assets/gameover.mp3"></audio>
    <audio id="sfx-pickup" src="assets/pickup.mp3"></audio>
    <audio id="sfx-revive" src="assets/revive-blast.mp3"></audio>
    <audio id="sfx-shatter" src="assets/shutter.mp3"></audio>

    <div id="boot-sequence">
        <div id="splash-1" class="splash-screen active">
            <h2 style="color: #4361ee; font-family: 'Fredoka One';">NovaForge Studios</h2>
        </div>
        <div id="splash-2" class="splash-screen">
            <p style="color: white; font-family: sans-serif;">Presents</p>
        </div>
        <div id="splash-3" class="splash-screen">
            <h1 class="game-title" style="margin-bottom: 20px;">
                <span class="t-red">B</span><span class="t-blue">L</span><span class="t-yellow">O</span><span class="t-green">C</span><span class="t-purple">K</span>
                <br>PUZZLE
            </h1>
            
            <div id="menu-buttons" style="display: flex; flex-direction: column; gap: 15px; width: 80%; max-width: 300px; align-items: center; opacity: 0; transform: translateY(20px); transition: all 0.5s ease 0.5s;">
                <button class="mode-btn classic-btn" onclick="startGame('classic')">
                    <span class="btn-icon">✨</span>
                    <div class="btn-text">
                        <span class="btn-title">CLASSIC MODE</span>
                        <span class="btn-sub">Endless Relaxing Puzzle</span>
                    </div>
                </button>
                <button class="mode-btn bomb-btn" onclick="startGame('bomb')">
                    <span class="btn-icon">💣</span>
                    <div class="btn-text">
                        <span class="btn-title">BOMB SURVIVAL</span>
                        <span class="btn-sub">Defuse or Explode!</span>
                    </div>
                </button>
            </div>
        </div>
    </div>

    <div id="game-container" style="opacity: 0;">
        <div id="header">
            <div id="stats-group" style="display: flex; gap: 15px;">
                <div id="high-score">👑 <span id="best-score-text">0</span></div>
                <div id="coin-balance">🪙 <span id="coin-text">0</span></div>
            </div>
            <div id="score-display">0</div>
            <div id="controls-group" style="display: flex; gap: 15px;">
                <div id="shop-icon" onclick="openShop()" style="cursor: pointer; font-size: 24px;">🛒</div>
                <div id="settings-icon" onclick="openSettings()" style="cursor: pointer; font-size: 24px;">⚙️</div>
            </div>
        </div>

        <div id="board-container">
            <div id="board"></div>
        </div>

        <div id="tray">
            <div class="tray-slot" id="slot-0"></div>
            <div class="tray-slot" id="slot-1"></div>
            <div class="tray-slot" id="slot-2"></div>
        </div>

        <div id="shop-modal" class="modal-overlay" style="display: none;">
            <div class="settings-content" style="width: 90%; max-width: 350px;">
                <div class="settings-header">
                    <h2>🛒 BLOCK SHOP</h2>
                    <button class="close-btn" onclick="closeShop()">✖</button>
                </div>
                <div style="text-align: center; color: #ffca3a; margin-bottom: 15px; font-weight: bold;">
                    Your Balance: 🪙 <span id="shop-coin-balance">0</span>
                </div>
                <div id="shop-items-container" style="display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; padding-right: 5px;">
                    </div>
            </div>
        </div>

        <div id="settings-modal" class="modal-overlay" style="display: none;">
            <div class="settings-content">
                <div class="settings-header">
                    <h2>Settings</h2>
                    <button class="close-btn" onclick="closeSettings()">✖</button>
                </div>
                <div class="setting-row">
                    <span>Sound Effects</span>
                    <button id="sfx-toggle" class="toggle-btn on" onclick="toggleSfx()">ON</button>
                </div>
            </div>
        </div>

        <div id="game-over" class="modal-overlay" style="display: none;">
            <div class="game-over-content">
                <h2>Out of Moves!</h2>
                <div class="score-display-end">Score: <span id="final-score">0</span></div>
                <button id="revive-btn" class="action-btn revive" onclick="revive()">🎥 FREE REVIVE</button>
                <button class="action-btn restart" onclick="resetGame()">🔄 RESTART</button>
            </div>
        </div>

        <div id="tutorial-overlay" class="modal-overlay" style="display: none;" onclick="closeTutorial()">
            <div class="tutorial-hand">👆</div>
            <div class="tutorial-text">Drag blocks to the board.<br>Fill a row or column to clear it!</div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
